name: CI/CD Pipeline

on:
  pull_request:
    - Develop
    - main
    - feature/reto6

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar proyecto
        run: mvn clean compile -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      SPRING_PROFILES_ACTIVE: mongo
      SPRING_DATA_MONGODB_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ejecutar tests
        run: mvn verify -DskipTests=false

  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    needs: test
    env:
      SPRING_PROFILES_ACTIVE: mongo
      SPRING_DATA_MONGODB_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar -Dsonar.organization=juanlopeztw -Dsonar.projectKey=JuanLopezTW_-DOSW-Library -Dsonar.host.url=https://sonarcloud.io

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "En construcción ..."